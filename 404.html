<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to docs.datasqrl.com</title>
  <link rel="canonical" href="https://docs.datasqrl.com/">
  <meta http-equiv="refresh" content="0; url=https://docs.datasqrl.com/">
  <script>
    window.location.replace(
      "https://docs.datasqrl.com" +
      window.location.pathname +
      window.location.search +
      window.location.hash
    );
  </script>
</head>
<body>
  <p>Documentation has moved to <a href="https://docs.datasqrl.com/">docs.datasqrl.com</a>.</p>
</body>
</html>
